name: Build Linux artifacts
on:
  push:
    branches: [ main, master ]
  workflow_dispatch: {}

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential cmake

      - name: Configure CMake
        run: cmake -S . -B build

      - name: Build spec_strategy and quant_runner
        run: |
          cmake --build build --target spec_strategy -j
          cmake --build build --target quant_runner -j

      - name: Smoke test runner with tiny.csv
        run: |
          ./build/quant_runner build/spec_strategy.so data/tiny.csv

      - name: List build outputs
        run: ls -l build || true

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: linux-build
          path: |
            build/spec_strategy.so
            build/quant_runner
